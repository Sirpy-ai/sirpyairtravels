<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Sirpy Air Travels</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/admin.css?v=3a6e323c">
</head>
<body>

<!-- Login -->
<section class="login" id="loginView" hidden>
  <div class="login-card">
    <img src="/assets/img/logo.png" alt="Sirpy Air Travels" width="150" height="49">
    <h1>Admin login</h1>
    <button class="btn btn-ghost google-btn" type="button" id="googleLogin" hidden>
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google</button>
    <form id="loginForm" novalidate>
      <label for="loginEmail">Admin email</label>
      <input id="loginEmail" type="email" autocomplete="email" required placeholder="you@gmail.com">
      <button class="btn btn-yellow" type="submit">Email me a login link</button>
    </form>
    <form id="codeForm" hidden novalidate>
      <p class="hint" id="codeHint"></p>
      <label for="loginCode">Or type the code from the email</label>
      <input id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456">
      <button class="btn btn-dark" type="submit">Log in with code</button>
      <button class="link" type="button" id="loginBack">Use a different email</button>
    </form>
    <p class="msg" id="loginMsg" aria-live="polite"></p>
    <a class="back-site" href="/">← Back to the website</a>
  </div>
</section>

<!-- Not an admin -->
<section class="login" id="deniedView" hidden>
  <div class="login-card">
    <h1>No admin access</h1>
    <p><b id="deniedEmail"></b> is not on the admin list.</p>
    <button class="btn btn-dark" type="button" data-signout>Sign out</button>
  </div>
</section>

<!-- Portal -->
<div class="app" id="appView" hidden>
  <header class="topbar">
    <button class="burger" type="button" id="navToggle" aria-label="Menu">☰</button>
    <a class="brand" href="/admin"><img src="/assets/img/logo.png" alt="Sirpy Air Travels" width="98" height="32"><span>Admin</span></a>
    <span class="who" id="whoEmail"></span>
    <a class="btn btn-ghost btn-sm" href="/" target="_blank" rel="noopener">View site</a>
    <button class="btn btn-dark btn-sm" type="button" data-signout>Sign out</button>
  </header>
  <nav class="side" id="sideNav" aria-label="Admin sections">
    <a href="#dashboard" data-tab="dashboard">📊 Dashboard</a>
    <a href="#bookings" data-tab="bookings">✈️ Bookings <b class="badge" data-count="bookings"></b></a>
    <a href="#enquiries" data-tab="enquiries">💬 Enquiries <b class="badge" data-count="enquiries"></b></a>
    <a href="#subscribers" data-tab="subscribers">📧 Sign-ins</a>
    <a href="#posts" data-tab="posts">📝 Blog posts</a>
    <a href="#fares" data-tab="fares">💲 Fares</a>
  </nav>
  <main class="main" id="main"></main>
</div>

<!-- Side drawer for one record -->
<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog">
  <button class="drawer-x" type="button" id="drawerClose" aria-label="Close">✕</button>
  <div id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/js/site.js?v=3a6e323c"></script>
<script src="/assets/js/md.js?v=3a6e323c"></script>
<script src="/assets/js/admin.js?v=3a6e323c"></script>
</body>
</html>
